<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>GameForge | Register</title>
  <link rel="stylesheet" href="../assets/css/style.css">
</head>

<body class="login-page">

  <main class="login-container">

    <!-- Brand Section -->
    <section class="login-brand">
      <div class="compass-placeholder">✦</div>

      <p class="small-heading">JOIN THE COMMUNITY</p>
      <h1>INDIE GAME HUB</h1>
      <p class="tagline">EXPLORE • CREATE • PLAY • BELONG</p>
    </section>

    <!-- Registration Form -->
    <section class="login-panel">
      <h2>CREATE ACCOUNT</h2>

      <form>

        <div class="form-group">
          <label>Username</label>
          <input required placeholder="Choose a username">
        </div>

        <div class="form-group">
          <label>Email</label>
          <input type="email" required placeholder="Enter your email">
          <label>Password</label>
          <input type="password" required placeholder="Create a password">
        </div>
        <div class="form-group">
          <label>Confirm Password</label>
          <input type="password" required placeholder="Confirm password">
        </div>
        <div class="role-selection">
          <label class="role-card">
          <input type="radio" name="role" required> 🎮 <strong>Gamer</strong><small>Play, download and rate games.</small></label>
          <label class="role-card"><input type="radio" name="role"> ⚙ <strong>Developer</strong><small>Upload and share games.</small></label>
        </div>
        <button class="primary-btn" type="submit">Create Account</button>
      </form><p><a class="text-link" href="../../index.html">Back to Sign In</a></p></section></main></body></html>
